[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "la-host"
version = "0.0.0"
description = "Native Windows host tools for the RTOS logic analyzer"
requires-python = ">=3.10"
dependencies = [
  "pyserial==3.5",
  "numpy==2.2.6",
  "pyvcd==0.4.0",
  "click==8.1.8",
  "PyYAML==6.0.2",
  "pytest==8.3.5",
  "matplotlib==3.10.1",
]

[project.optional-dependencies]
usb-bench = [
  "pyusb==1.3.1",
  "libusb-package==1.0.26.2",
]

[project.scripts]
la-cli = "host.la_cli:main"

[tool.setuptools]
packages = ["host", "host.la_cli", "host.la_live_web", "host.la_sigrok_bridge", "tools", "tools.models"]

[tool.setuptools.package-data]
"host.la_live_web" = ["static/index.html"]

[tool.pytest.ini_options]
testpaths = ["host/tests", "tests"]
addopts = "-ra"
