<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTOS Logic Analyzer - host live view</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 13px/1.45 Consolas, "Courier New", monospace;
         background: #101418; color: #d6e2ea; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px;
           background: #182028; border-bottom: 1px solid #26323c; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  .pill { padding: 2px 9px; border-radius: 10px; font-size: 11px;
          background: #3a2020; color: #ff9d9d; }
  .pill.on { background: #14351f; color: #7ee2a0; }
  .pill.busy { background: #3a3320; color: #ffd479; }
  button.ctl { font: inherit; padding: 3px 14px; border: 1px solid #2c3a46;
               background: #182028; color: #9fb3c1; border-radius: 4px;
               cursor: pointer; }
  button.ctl:hover:not(:disabled) { border-color: #4a5f70; color: #d6e2ea; }
  button.ctl:disabled { opacity: .45; cursor: default; }
  #msg { color: #ff9d9d; font-size: 12px; }
  nav { display: flex; gap: 6px; padding: 8px 14px 0; }
  nav button { font: inherit; padding: 4px 14px; border: 1px solid #2c3a46;
               background: #182028; color: #9fb3c1; border-radius: 4px 4px 0 0;
               cursor: pointer; }
  nav button.active { background: #0f1720; color: #7ec8ff; border-bottom-color: #0f1720; }
  main { padding: 0 14px 10px; }
  pre.pane { display: none; margin: 0; height: 62vh; overflow-y: auto;
             background: #0f1720; border: 1px solid #26323c; border-radius: 0 4px 4px 4px;
             padding: 8px 10px; white-space: pre-wrap; word-break: break-all;
             contain: content; }
  pre.pane.active { display: block; }
  .line { white-space: pre-wrap; word-break: break-all; }
  .t { color: #5d7284; }
  .b { color: #e8f4ff; }
  .e { color: #ffb86b; }
  .m { color: #8f9fb0; }
  footer { display: flex; flex-wrap: wrap; gap: 16px; padding: 8px 14px;
           color: #8fa3b3; font-size: 12px; border-top: 1px solid #26323c; }
</style>
</head>
<body>
<header>
  <h1>RTOS Logic Analyzer &mdash; host live view</h1>
  <button id="start" class="ctl">Start</button>
  <button id="stop" class="ctl" disabled>Stop</button>
  <span id="session" class="pill">idle</span>
  <span id="conn" class="pill">connecting</span>
  <span id="msg"></span>
</header>
<nav>
  <button data-slot="0" class="active">Decoder 0</button>
  <button data-slot="1">Decoder 1</button>
  <button data-slot="2">Decoder 2</button>
</nav>
<main>
  <pre id="pane0" class="pane active"></pre>
  <pre id="pane1" class="pane"></pre>
  <pre id="pane2" class="pane"></pre>
</main>
<footer>
  <span id="stats">no stats yet</span>
  <span id="counts"></span>
</footer>
<script>
"use strict";
const KINDS = {1:"BYTE",2:"FRAME_ERR",3:"PARITY_ERR",4:"START",5:"STOP",
               6:"DISCONT",7:"ADDRESS",8:"ACK",9:"NACK",10:"CS_ASSERT",
               11:"CS_RELEASE"};
// Rendering budget: incoming records are coalesced and drawn once per
// animation frame. The DOM keeps at most MAX_LINES lines per pane; when a
// frame arrives with more than RENDER_BUDGET records, the oldest are counted
// as display-skipped instead of freezing the page.
const MAX_LINES = 2000;
const TRIM_CHUNK = 500;
const RENDER_BUDGET = 2000;
const panes = [document.getElementById("pane0"),
               document.getElementById("pane1"),
               document.getElementById("pane2")];
const paneState = [{firstT: null, lines: 0},
                   {firstT: null, lines: 0},
                   {firstT: null, lines: 0}];
let displayed = 0;
let displaySkipped = 0;
let dropped = 0;
let pending = [];
let renderQueued = false;
let sessionState = "idle";

document.querySelectorAll("nav button").forEach(function (button) {
  button.addEventListener("click", function () {
    document.querySelectorAll("nav button").forEach(function (other) {
      other.classList.toggle("active", other === button);
    });
    panes.forEach(function (pane, slot) {
      pane.classList.toggle("active", slot === Number(button.dataset.slot));
    });
  });
});

function setSessionState(state) {
  sessionState = state;
  const pill = document.getElementById("session");
  pill.textContent = state;
  pill.className = "pill" + (state === "streaming" ? " on" :
                             (state === "stopping" ? " busy" : ""));
  document.getElementById("start").disabled = state !== "idle";
  document.getElementById("stop").disabled = state !== "streaming";
}

function updateCounts() {
  document.getElementById("counts").textContent =
    "shown " + displayed +
    (displaySkipped ? " | display-skipped " + displaySkipped : "") +
    (dropped ? " | dropped " + dropped : "");
}

function clearPanes() {
  panes.forEach(function (pane) { pane.innerHTML = ""; });
  paneState.forEach(function (state) { state.firstT = null; state.lines = 0; });
  displayed = 0;
  displaySkipped = 0;
  dropped = 0;
  pending = [];
  updateCounts();
}

function post(path) {
  return fetch(path, {method: "POST"}).then(function (response) {
    return response.json().catch(function () { return {}; }).then(function (body) {
      if (!response.ok) {
        throw new Error(body.error || ("HTTP " + response.status));
      }
      return body;
    });
  });
}

document.getElementById("start").addEventListener("click", function () {
  const msg = document.getElementById("msg");
  msg.textContent = "";
  post("/control/start").then(function (body) {
    clearPanes();
    setSessionState(body.state || "streaming");
  }).catch(function (error) {
    msg.textContent = error.message;
  });
});

document.getElementById("stop").addEventListener("click", function () {
  const msg = document.getElementById("msg");
  msg.textContent = "";
  post("/control/stop").then(function (body) {
    setSessionState(body.state || "idle");
  }).catch(function (error) {
    msg.textContent = error.message;
  });
});

function hexToText(hex) {
  let text = "";
  for (let index = 0; index + 1 < hex.length; index += 2) {
    const code = parseInt(hex.substr(index, 2), 16);
    if (code === 0x0a) { text += "\\n"; }
    else if (code === 0x0d) { text += "\\r"; }
    else if (code === 0x09) { text += "\\t"; }
    else if (code >= 0x20 && code < 0x7f) { text += String.fromCharCode(code); }
    else { text += "\\x" + code.toString(16).padStart(2, "0"); }
  }
  return text;
}

function makeLine(slot, kind, tSample, hex) {
  const state = paneState[slot];
  if (state.firstT === null) { state.firstT = tSample; }
  const line = document.createElement("div");
  line.className = "line";
  const time = document.createElement("span");
  time.className = "t";
  time.textContent = "+" + (tSample - state.firstT);
  const body = document.createElement("span");
  if (kind === 1) {
    body.className = "b";
    body.textContent = hexToText(hex);
  } else {
    body.className = "e";
    body.textContent = "<" + (KINDS[kind] || ("KIND" + kind)) + ">" +
                       (hex ? " " + hex : "");
  }
  line.appendChild(time);
  line.appendChild(document.createTextNode(" "));
  line.appendChild(body);
  return line;
}

function queueRecords(slot, list) {
  for (let index = 0; index < list.length; index += 1) {
    const record = list[index];
    pending.push({slot: slot, kind: record[1], t: record[0],
                  data: record[2] || ""});
  }
  if (pending.length > RENDER_BUDGET) {
    const excess = pending.length - RENDER_BUDGET;
    pending.splice(0, excess);
    displaySkipped += excess;
  }
  if (!renderQueued) {
    renderQueued = true;
    requestAnimationFrame(render);
  }
}

function render() {
  renderQueued = false;
  const batch = pending;
  pending = [];
  const fragments = new Map();
  batch.forEach(function (record) {
    if (record.slot < 0 || record.slot > 2) { return; }
    let fragment = fragments.get(record.slot);
    if (!fragment) {
      fragment = document.createDocumentFragment();
      fragments.set(record.slot, fragment);
    }
    fragment.appendChild(makeLine(record.slot, record.kind, record.t, record.data));
    paneState[record.slot].lines += 1;
    displayed += 1;
  });
  fragments.forEach(function (fragment, slot) {
    const pane = panes[slot];
    const atBottom = pane.scrollTop + pane.clientHeight >= pane.scrollHeight - 8;
    pane.appendChild(fragment);
    if (pane.childNodes.length > MAX_LINES + TRIM_CHUNK) {
      const before = pane.scrollHeight;
      let excess = pane.childNodes.length - MAX_LINES;
      while (excess-- > 0) { pane.removeChild(pane.firstChild); }
      if (!atBottom) { pane.scrollTop -= (before - pane.scrollHeight); }
    }
    if (atBottom) { pane.scrollTop = pane.scrollHeight; }
  });
  updateCounts();
}

function showStats(s) {
  document.getElementById("stats").textContent =
    "target " + (s.target || "-") + " | decoder " + (s.decoder || "-") +
    " | events " + s.events + " | messages " + s.messages +
    " | ring " + s.ring + "/" + s.ring_capacity +
    " | dropped " + s.dropped;
  dropped = s.dropped;
  if (s.state && s.state !== sessionState) { setSessionState(s.state); }
  if (s.error) { document.getElementById("msg").textContent = s.error; }
  updateCounts();
}

function connect() {
  const pill = document.getElementById("conn");
  const source = new EventSource("/events");
  source.onopen = function () {
    pill.textContent = "connected";
    pill.className = "pill on";
  };
  source.onerror = function () {
    pill.textContent = "reconnecting";
    pill.className = "pill";
  };
  source.onmessage = function (event) {
    let message;
    try { message = JSON.parse(event.data); } catch (error) { return; }
    if (message.stats) {
      showStats(message.stats);
      return;
    }
    if (message.e) { queueRecords(message.s, message.e); }
  };
}

connect();
</script>
</body>
</html>
